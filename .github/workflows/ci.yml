name: Bioinformatics Platform CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi httpx uvicorn pydantic flake8

       - name: Lint
        run: |
          flake8 gateway/ --max-line-length=120 --ignore=E501,E241,E221,E302,W291,E722
          echo "✅ Lint passed"

      - name: Validate gateway imports
        run: |
          python3 -c "from gateway.main import app; print('✅ Gateway imports valid')"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        run: |
          pip install safety
          pip install fastapi httpx uvicorn
          safety check || true
          echo "✅ Security scan complete"

  test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi httpx uvicorn pytest pytest-asyncio pydantic

      - name: Run tests
        run: |
          python3 -c "
          from fastapi.testclient import TestClient
          import sys
          sys.path.insert(0, '.')
          from gateway.main import app
          client = TestClient(app)

          # Test root
          r = client.get('/')
          assert r.status_code == 200
          assert r.json()['status'] == 'healthy'
          print('✅ Root endpoint test passed')

          # Test metrics
          r = client.get('/metrics')
          assert r.status_code == 200
          assert 'total_requests' in r.json()
          print('✅ Metrics endpoint test passed')

          print('✅ All tests passed!')
          "
